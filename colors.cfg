# ---------------------------------------------------------------------------
# Military / tactical palette
#   - dusty olive ground, dark tactical sky
#   - interior walls painted with off-white stencil edges (vehicle markings)
#   - perimeter ringed in caution yellow (warning / restricted zone)
#   - teams = real military faction tones: OD green, desert sand, jungle,
#     navy blue, brick red, coyote brown
#   - bot_llm in hi-vis orange — the experimental / test unit on the range
#   - phosphor-white tracer fire, red-threat scan pings, ordnance explosions
# ---------------------------------------------------------------------------

# Terrain
terrain              =  75,  75,  55       # packed dirt arena (dusty olive)
grid                 =  50,  55,  35       # subtle olive grid

# Walls
wall_fill            =  70,  80,  60       # military green-grey
wall_wire            = 210, 210, 175       # off-white stencil edges
border_fill          =  60,  55,  40       # khaki border
border_wire          = 240, 200,  70       # caution yellow perimeter

# Team colors (0-5 = non-LLM, 6 = LLM)
team_0               = 130, 140,  80       # bot_light       — OD infantry green
team_1               = 200, 170, 110       # bot_skirmisher  — desert sand
team_2               =  80, 110,  65       # bot_chaser      — jungle green
team_3               =  60,  80, 110       # bot_duelist     — navy blue
team_4               = 180,  70,  55       # bot_lancer      — brick red
team_5               = 140, 110,  80       # bot_fortress    — coyote brown
team_6               = 255, 130,  30       # bot_llm         — hi-vis orange (experimental)

# Bot parts
bot_tread            =  45,  50,  40       # dark olive gunmetal
bot_weapon           = 110, 115, 105       # gunmetal grey

# HP / Armour bars
hp_full              =  90, 150,  80       # signal green
hp_mid               = 220, 180,  60       # caution amber
hp_low               = 200,  60,  50       # warning red
hp_bg                =  15,  18,  15, 200  # field dark
armour_fill          = 130, 145, 160       # gunmetal blue-grey
armour_bg            =  15,  18,  15, 200  # field dark

# Projectiles
laser                = 255, 240, 200       # phosphor tracer

# Scan lines
scan_wall            =  90, 100,  70,  60  # olive ping toward walls
scan_enemy           = 200,  70,  50,  90  # red threat ping toward enemies

# Explosions (ordnance)
explosion_0          = 180,  80,  40       # ignition smoke-orange
explosion_1          = 255, 130,  50       # flame orange
explosion_2          = 255, 220, 120       # peak yellow
explosion_3          = 130,  40,  30       # cordite red
explosion_4          = 255, 240, 200       # white-yellow flash
explosion_ring       = 180, 170, 150, 200  # smoke shockwave
explosion_flash      = 255, 250, 230       # central flash

# Backgrounds
bg_clear             =  15,  20,  18       # dark tactical night
bg_config            =  22,  26,  22       # config dark olive
bg_results           =  10,  14,  12       # results dark
