# ---------------------------------------------------------------------------
# Pale supergraphic palette
#   - warm cream sky, putty floor, walnut grid lines
#   - flat muted earth tones in big blocks of colour (terracotta, sage,
#     mustard, dusty teal, lavender) with strong dark walnut outlines
#   - bot_llm in cobalt navy so it pops hardest against the cream backdrop
# ---------------------------------------------------------------------------

# Terrain
terrain              = 220, 210, 188       # warm putty floor
grid                 = 165, 145, 115       # walnut grid lines

# Walls
wall_fill            = 165, 180, 165       # muted sage
wall_wire            =  60,  45,  35       # walnut outline
border_fill          = 195, 130, 100       # terracotta panels
border_wire          =  55,  35,  25       # deep umber outline

# Team colors (0-5 = non-LLM, 6 = LLM)
team_0               = 220, 150, 145       # bot_light       — dusty rose
team_1               = 160, 180, 130       # bot_skirmisher  — sage
team_2               = 110, 165, 175       # bot_chaser      — dusty teal
team_3               = 170, 140, 180       # bot_duelist     — pale lavender
team_4               = 215, 180,  90       # bot_lancer      — mustard
team_5               = 200, 120,  80       # bot_fortress    — burnt orange
team_6               =  65,  95, 140       # bot_llm         — cobalt navy

# Bot parts
bot_tread            =  75,  65,  55       # charcoal walnut
bot_weapon           = 130, 120, 105       # warm pewter

# HP / Armour bars
hp_full              =  95, 145,  85       # muted forest
hp_mid               = 205, 165,  60       # mustard
hp_low               = 180,  75,  60       # brick red
hp_bg                =  50,  40,  35, 200  # dark slate
armour_fill          = 135, 155, 180       # dusty steel blue
armour_bg            =  50,  40,  35, 200  # dark slate

# Projectiles
laser                = 215, 100,  90       # warm coral beam

# Scan lines
scan_wall            = 100,  80,  60,  80  # muted brown toward walls
scan_enemy           = 120, 130,  70,  80  # olive toward enemies

# Explosions (warm earth tones)
explosion_0          = 210, 100,  50       # burnt orange
explosion_1          = 215, 165,  75       # ochre
explosion_2          = 240, 220, 140       # cream yellow
explosion_3          = 160,  60,  40       # brick red
explosion_4          = 245, 230, 170       # pale lemon
explosion_ring       = 215, 165,  75, 200  # shockwave ring
explosion_flash      = 250, 245, 220       # central flash

# Backgrounds
bg_clear             = 232, 222, 200       # warm cream
bg_config            = 225, 215, 195       # pale almond
bg_results           = 240, 232, 215       # paper white
